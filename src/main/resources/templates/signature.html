<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Assinatura</title>
  </head>

  <body>
    <p>
      <span style="font-family: Verdana, Geneva, sans-serif">
        Com os melhores cumprimentos | Best regards,</span
      >
    </p>

    <table
      style="
        border-collapse: collapse;
        font-family: Inter, Helvetica, Arial, sans-serif;
        color: #000000;
        font-size: 8pt;
        line-height: 1.35;
        width: 100%;
        max-width: 700px;
      "
      border="0"
      cellspacing="0"
      cellpadding="0"
    >
      <tbody>
        <tr>
          <td style="padding: 0">
            <div>&nbsp;</div>

            <!-- TABELA PRINCIPAL DA ASSINATURA -->
            <table
              style="border-collapse: collapse; width: 100%"
              border="0"
              cellspacing="0"
              cellpadding="0"
            >
              <tbody>
                <tr>
                  <!-- ========================= -->
                  <!-- COLUNA ESQUERDA -->
                  <!-- ========================= -->
                  <td
                    style="
                      padding: 0 12px 0 0;
                      vertical-align: top;
                      width: 60%;
                      max-width: 420px;
                    "
                  >
                    <!-- NOME -->
                    <div
                      style="
                        font-family: Verdana, Geneva, sans-serif;
                        font-weight: bold;
                        color: #000000;
                        font-size: 14pt;
                        line-height: 1.2;
                        margin: 0 0 4px 0;
                      "
                      th:text="${employee.name}"
                    >
                      Nome do colaborador
                    </div>

                    <!-- CARGO -->
                    <div
                      style="
                        font-family: Verdana, Geneva, sans-serif;
                        font-weight: 500;
                        color: #7e8c8d;
                        font-size: 12pt;
                        margin: 0 0 20px 0;
                      "
                      th:text="${employee.position}"
                    >
                      Cargo
                    </div>

                    <!-- TELEFONE -->
                    <div
                      style="
                        font-family: Verdana, Geneva, sans-serif;
                        color: #000000;
                        font-size: 12pt;
                        margin: 0 0 6px 0;
                      "
                    >
                      Tel:
                      <a
                        style="color: inherit; text-decoration: none"
                        th:href="'tel:' + ${employee.phone}"
                        th:text="${employee.phone}"
                      >
                        +244 000 000 000
                      </a>
                    </div>

                    <!-- EMAIL -->
                    <div
                      style="
                        font-family: Verdana, Geneva, sans-serif;
                        color: #000000;
                        font-size: 12pt;
                        margin: 0 0 6px 0;
                      "
                    >
                      E-mail:
                      <a
                        style="color: inherit; text-decoration: none"
                        th:href="'mailto:' + ${employee.email}"
                        th:text="${employee.email}"
                      >
                        email@grupowedo.ao
                      </a>
                    </div>

                    <!-- WEBSITE -->
                    <div
                      style="
                        font-family: Verdana, Geneva, sans-serif;
                        color: #000000;
                        font-size: 12pt;
                        margin: 0 0 8px 0;
                      "
                    >
                      Website:
                      <a
                        style="color: inherit; text-decoration: none"
                        href="https://grupowedo.ao"
                      >
                        www.grupowedo.ao
                      </a>
                    </div>

                    <!-- REDES SOCIAIS -->
                    <table
                      style="border-collapse: collapse; margin-top: 12px"
                      border="0"
                      cellspacing="0"
                      cellpadding="0"
                    >
                      <tbody>
                        <tr>
                          <!-- FACEBOOK -->
                          <td style="padding-right: 8px">
                            <a href="https://facebook.com/">
                              <img
                                style="
                                  display: block;
                                  border: 0;
                                  outline: none;
                                  text-decoration: none;
                                  vertical-align: middle;
                                "
                                src="https://res.cloudinary.com/jqgxvpiv/image/upload/v1786117641/face-icon_nknabx.png"
                                alt="Facebook"
                                width="23"
                                height="23"
                              />
                            </a>
                          </td>

                          <!-- LINKEDIN -->
                          <td style="padding-right: 8px">
                            <a href="https://linkedin.com/">
                              <img
                                style="
                                  display: block;
                                  border: 0;
                                  outline: none;
                                  text-decoration: none;
                                  vertical-align: middle;
                                "
                                src="https://res.cloudinary.com/jqgxvpiv/image/upload/v1786117641/linkedin-icon_suefyj.png"
                                alt="LinkedIn"
                                width="23"
                                height="23"
                              />
                            </a>
                          </td>

                          <!-- INSTAGRAM -->
                          <td>
                            <a href="https://instagram.com/">
                              <img
                                style="
                                  display: block;
                                  border: 0;
                                  outline: none;
                                  text-decoration: none;
                                  vertical-align: middle;
                                "
                                src="https://res.cloudinary.com/jqgxvpiv/image/upload/v1786117640/insta-icon_c2yc8b.png"
                                alt="Instagram"
                                width="23"
                                height="23"
                              />
                            </a>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </td>

                  <!-- ========================= -->
                  <!-- COLUNA DIREITA / LOGO -->
                  <!-- ========================= -->
                  <td
                    style="
                      vertical-align: top;
                      padding-left: 12px;
                      width: 40%;
                      max-width: 280px;
                      text-align: right;
                    "
                  >
                    <table
                      style="
                        background-color: #ffffff;
                        padding: 6px;
                        border-radius: 6px;
                        display: inline-block;
                      "
                      border="0"
                      cellspacing="0"
                      cellpadding="0"
                    >
                      <tbody>
                        <tr>
                          <td style="vertical-align: middle">
                            <img
                              style="
                                display: block;
                                width: 100%;
                                max-width: 302px;
                                height: auto;
                                border: 0;
                                outline: none;
                                text-decoration: none;
                                -ms-interpolation-mode: bicubic;
                              "
                              src="https://res.cloudinary.com/jqgxvpiv/image/upload/v1786117639/group-icon-named_jqhquj.png"
                              alt="Grupo Wedo - Logo"
                              width="302"
                            />
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- ========================= -->
            <!-- BARRA INFERIOR -->
            <!-- ========================= -->
            <p style="margin: 0; padding-top: 10px">
              <img
                style="
                  display: block;
                  border: 0;
                  outline: none;
                  text-decoration: none;
                "
                src="https://res.cloudinary.com/jqgxvpiv/image/upload/v1786117646/group_sign_iihdkl.gif"
                width="100%"
                height="15"
                alt="Grupo Wedo"
              />
            </p>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
